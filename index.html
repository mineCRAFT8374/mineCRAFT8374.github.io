<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #0a7d72, #0d5f58);
        font-family: Arial, sans-serif;
        color: white;
      }

      .panel {
        background: rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 18px;
        padding: 32px 24px;
        width: min(90vw, 500px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        text-align: center;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .game-link {
        display: block;
        margin: 12px auto;
        padding: 16px 20px;
        max-width: 300px;
        text-decoration: none;
        color: white;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        font-size: 1.05rem;
        transition: 0.2s ease;
      }

      .game-link:hover {
        background: rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <h1>Game Hub</h1>

      <a class="game-link" href="sm64.html">Super Mario 64</a>
      <a class="game-link" href="snowrider3D.html">Snow Rider 3D</a>
    </div>
  </body>
</html>
