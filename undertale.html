<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undertale Mini Game</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #171f2d;
        --panel-2: #0f172a;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --blue: #7dd3fc;
        --pink: #f9a8d4;
        --green: #86efac;
        --yellow: #fcd34d;
        --red: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #0d1322, #151d2d);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .game-shell {
        width: min(920px, 92vw);
        background: rgba(17, 24, 39, 0.96);
        border: 3px solid var(--pink);
        border-radius: 20px;
        box-shadow: 0 0 40px rgba(249, 168, 212, 0.15);
        overflow: hidden;
      }

      .topbar {
        background: linear-gradient(90deg, rgba(125, 211, 252, 0.12), rgba(249, 168, 212, 0.12));
        border-bottom: 2px solid rgba(255,255,255,0.08);
        padding: 12px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--blue);
      }

      .status {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .battle-area {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 20px;
        padding: 20px;
      }

      .battle-panel {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 18px;
      }

      .enemy-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 240px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(249,168,212,0.08), rgba(125,211,252,0.04));
        border: 1px solid rgba(249,168,212,0.25);
        position: relative;
      }

      .enemy-face {
        font-size: clamp(3rem, 10vw, 5rem);
        margin-bottom: 8px;
      }

      .enemy-name {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--pink);
      }

      .hp {
        width: 100%;
        margin-top: 16px;
      }

      .hp-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.76rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .bar {
        height: 16px;
        width: 100%;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .bar-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
        border-radius: 999px;
        transition: width 0.25s ease;
      }

      .log {
        margin-top: 18px;
        padding: 14px;
        border-radius: 12px;
        min-height: 130px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(125, 211, 252, 0.18);
      }

      .log-title {
        font-size: 0.76rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--blue);
      }

      .log-text {
        margin-top: 10px;
        color: var(--ink);
        line-height: 1.6;
      }

      .side-panel {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 16px;
      }

      .player-box {
        padding: 12px 10px;
        background: rgba(125, 211, 252, 0.06);
        border-radius: 12px;
        border: 1px solid rgba(125, 211, 252, 0.16);
      }

      .player-name {
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--blue);
      }

      .stat-row {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .menu {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .btn {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        color: var(--ink);
        padding: 12px 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .btn:hover {
        background: rgba(125, 211, 252, 0.12);
      }

      .btn.primary {
        background: var(--pink);
        color: #111827;
        border-color: var(--pink);
      }

      .btn.good {
        background: var(--green);
        color: #112018;
        border-color: var(--green);
      }

      .btn.warn {
        background: var(--yellow);
        color: #1a1201;
        border-color: var(--yellow);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      @media (max-width: 700px) {
        .battle-area {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="topbar">
        <div class="brand">Undertale Mini</div>
        <div class="status" id="status">Encounter started</div>
      </div>

      <div class="battle-area">
        <div class="battle-panel">
          <div class="enemy-box">
            <div class="enemy-face" id="enemyFace">🙂</div>
            <div class="enemy-name" id="enemyName">SANS</div>

            <div class="hp">
              <div class="hp-label">
                <span>HP</span>
                <span id="enemyHpLabel">36 / 36</span>
              </div>
              <div class="bar"><div class="bar-fill" id="enemyBar"></div></div>
            </div>
          </div>

          <div class="log">
            <div class="log-title">Battle Log</div>
            <div class="log-text" id="logText">
              A strange little encounter appears before you.
            </div>
          </div>
        </div>

        <aside class="side-panel">
          <div class="player-box">
            <div class="player-name">FRISK</div>
            <div class="stat-row"><span>HP</span><span id="playerHp">20 / 20</span></div>
            <div class="stat-row"><span>LOVE</span><span id="love">3</span></div>
            <div class="stat-row"><span>ACTS</span><span id="acts">0</span></div>
          </div>

          <div class="menu">
            <button class="btn primary" id="fightBtn">Fight</button>
            <button class="btn" id="actBtn">Act</button>
            <button class="btn warn" id="itemBtn">Item</button>
            <button class="btn good" id="mercyBtn">Mercy</button>
            <button class="btn" id="restartBtn" style="grid-column: 1 / -1;">Restart</button>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const state = {
        playerHp: 20,
        enemyHp: 36,
        love: 3,
        acts: 0,
        won: false,
        lost: false,
      };

      const enemyFace = document.getElementById('enemyFace');
      const enemyName = document.getElementById('enemyName');
      const enemyHpLabel = document.getElementById('enemyHpLabel');
      const enemyBar = document.getElementById('enemyBar');
      const logText = document.getElementById('logText');
      const playerHp = document.getElementById('playerHp');
      const love = document.getElementById('love');
      const acts = document.getElementById('acts');
      const status = document.getElementById('status');

      const maxEnemyHp = 36;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function setLog(message) {
        logText.textContent = message;
      }

      function updateHud() {
        playerHp.textContent = `${state.playerHp} / 20`;
        love.textContent = state.love;
        acts.textContent = state.acts;
        enemyHpLabel.textContent = `${state.enemyHp} / ${maxEnemyHp}`;
        const percent = Math.max(0, (state.enemyHp / maxEnemyHp) * 100);
        enemyBar.style.width = percent + '%';
      }

      function enemyTurn() {
        if (state.won || state.lost) return;

        const damage = rand(2, 7);
        state.playerHp = Math.max(0, state.playerHp - damage);
        const lines = [
          'The enemy attacks with a playful grin.',
          'A sharp little jolt hits you for ' + damage + ' damage.',
          'The encounter gets louder and you lose ' + damage + ' HP.',
          'The foe laughs and deals ' + damage + ' damage.'
        ];

        setLog(lines[rand(0, lines.length - 1)]);
        updateHud();

        if (state.playerHp <= 0) {
          state.lost = true;
          enemyFace.textContent = '💀';
          enemyName.textContent = 'YOU LOST';
          status.textContent = 'Run ended';
          setLog('You collapsed. The battle ends. Press Restart to try again.');
          document.querySelectorAll('.btn').forEach(btn => {
            if (btn.id !== 'restartBtn') btn.disabled = true;
          });
          return;
        }

        status.textContent = 'Your turn';
      }

      function handleWin() {
        state.won = true;
        status.textContent = 'Victory';
        enemyFace.textContent = '✨';
        enemyName.textContent = 'FRIENDSHIP';
        setLog('You win the encounter. The monster looks impressed. The battle ends happily.');
        document.querySelectorAll('.btn').forEach(btn => {
          if (btn.id !== 'restartBtn') btn.disabled = true;
        });
      }

      document.getElementById('fightBtn').addEventListener('click', () => {
        if (state.won || state.lost) return;

        const damage = rand(5, 12);
        state.enemyHp = Math.max(0, state.enemyHp - damage);
        state.love = Math.max(0, state.love - 1);
        setLog('You strike with a determined blow for ' + damage + ' damage!');
        updateHud();

        if (state.enemyHp <= 0) {
          handleWin();
          return;
        }

        enemyTurn();
      });

      document.getElementById('actBtn').addEventListener('click', () => {
        if (state.won || state.lost) return;

        state.acts += 1;
        const choices = [
          'You talk calmly. The enemy seems confused.',
          'You joke around. The mood gets a little less tense.',
          'You compliment the foe. It looks flustered.',
          'You ask if it wants to be friends.'
        ];

        const text = choices[rand(0, choices.length - 1)];
        const extra = rand(0, 2);

        if (extra === 0) {
          state.enemyHp = Math.max(0, state.enemyHp - 5);
          setLog(text + ' A small hit lands for 5 damage.');
        } else {
          setLog(text + ' The foe relaxes a bit.');
        }

        updateHud();

        if (state.enemyHp <= 0) {
          handleWin();
          return;
        }

        enemyTurn();
      });

      document.getElementById('itemBtn').addEventListener('click', () => {
        if (state.won || state.lost) return;

        if (state.playerHp >= 20) {
          setLog('You have no need for an item right now.');
          return;
        }

        const heal = rand(4, 7);
        state.playerHp = Math.min(20, state.playerHp + heal);
        setLog('You use a small healing item and recover ' + heal + ' HP.');
        updateHud();
        enemyTurn();
      });

      document.getElementById('mercyBtn').addEventListener('click', () => {
        if (state.won || state.lost) return;

        if (state.enemyHp <= 15 || state.love <= 1) {
          handleWin();
        } else {
          setLog('The foe does not seem ready to spare you yet.');
        }
      });

      document.getElementById('restartBtn').addEventListener('click', () => {
        state.playerHp = 20;
        state.enemyHp = 36;
        state.love = 3;
        state.acts = 0;
        state.won = false;
        state.lost = false;
        enemyFace.textContent = '🙂';
        enemyName.textContent = 'SANS';
        status.textContent = 'Encounter started';
        setLog('A strange little encounter appears before you.');
        document.querySelectorAll('.btn').forEach(btn => {
          btn.disabled = false;
        });
        updateHud();
      });

      updateHud();
    </script>
  </body>
</html>
