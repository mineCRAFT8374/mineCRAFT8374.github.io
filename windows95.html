<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 Desktop Simulation</title>
    <style>
        /* --- Core Theme Settings --- */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "MS Sans Serif", "Segoe UI", Tahoma, Arial, sans-serif;
            font-size: 12px;
            background-color: #008080; /* Classic Teal */
            user-select: none;
            height: 100vh;
            width: 100vw;
        }

        /* --- Windows 95 Bevel Effects --- */
        .win95-outset {
            background-color: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            box-shadow: inset 1px 1px 0px #dfdfdf, inset -1px -1px 0px #808080;
        }
        .win95-inset {
            background-color: #fff;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
        }
        .win95-btn {
            background-color: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 2px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }
        .win95-btn:active {
            border-top: 2px solid #000;
            border-left: 2px solid #000;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            padding: 3px 5px 1px 7px;
        }

        /* --- Desktop Items --- */
        .desktop-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 70px;
            text-align: center;
            color: white;
            cursor: default;
        }
        .desktop-icon img {
            width: 32px;
            height: 32px;
            margin-bottom: 4px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .desktop-icon span {
            display: inline-block;
            padding: 2px;
            text-shadow: 1px 1px 1px #000;
        }

        /* --- Window UI Component --- */
        .window {
            position: absolute;
            top: 100px;
            left: 150px;
            width: 400px;
            height: 300px;
            display: flex;
            flex-direction: column;
            padding: 3px;
            z-index: 10;
        }
        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px 4px 4px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            cursor: move;
        }
        .title-bar-text {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .title-bar-controls {
            display: flex;
            gap: 2px;
        }
        .control-btn {
            width: 16px;
            height: 14px;
            font-size: 9px;
            font-weight: bold;
            padding: 0;
            line-height: 10px;
        }
        .menu-bar {
            display: flex;
            gap: 10px;
            padding: 4px 0;
        }
        .menu-item {
            padding: 0 4px;
        }
        .menu-item span {
            text-decoration: underline;
        }
        .window-content {
            flex-grow: 1;
            margin-top: 2px;
        }
        .window-content textarea {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            outline: none;
            font-family: Courier New, monospace;
            font-size: 14px;
            padding: 4px;
        }

        /* --- Taskbar & Start Menu --- */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 40px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 999;
        }
        .start-btn {
            font-weight: bold;
            gap: 4px;
            height: 100%;
            padding: 2px 8px;
        }
        .start-btn img {
            width: 16px;
            height: 16px;
        }
        .start-menu {
            position: fixed;
            bottom: 40px;
            left: 2px;
            width: 180px;
            display: none;
            flex-direction: column;
            z-index: 1000;
            padding: 2px;
        }
        .start-menu-active {
            display: flex;
        }
        .start-menu-sidebar {
            width: 25px;
            background: linear-gradient(180deg, #000080, #1084d0);
            position: absolute;
            top: 2px;
            bottom: 2px;
            left: 2px;
            display: flex;
            align-items: flex-end;
            padding: 5px;
        }
        .start-menu-sidebar span {
            color: #c0c0c0;
            transform: rotate(-90deg);
            transform-origin: bottom left;
            white-space: nowrap;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 45px;
        }
        .start-menu-items {
            margin-left: 25px;
            display: flex;
            flex-direction: column;
            width: calc(100% - 25px);
        }
        .start-item {
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .start-item:hover {
            background-color: #000080;
            color: white;
        }
        .system-tray {
            height: 100%;
            padding: 2px 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- Desktop Icon -->
    <div class="desktop-icon" onclick="openNotepad()">
        <!-- Standard retro inline SVGs used for simplicity without external asset dependencies -->
        <svg viewBox="0 0 32 32" width="32" height="32"><path d="M4 2h18l6 6v22H4V2zm16 2V8h6L20 4zM6 4v26h20V10H18V4H6z" fill="#fff"/><rect x="8" y="12" width="12" height="2" fill="#000"/><rect x="8" y="16" width="16" height="2" fill="#000"/><rect x="8" y="20" width="14" height="2" fill="#000"/></svg>
        <span>Notepad</span>
    </div>

    <!-- Application Window -->
    <div class="window win95-outset" id="notepadWindow">
        <div class="title-bar" id="titleBar">
            <div class="title-bar-text">
                <svg viewBox="0 0 32 32" width="14" height="14"><path d="M4 2h18l6 6v22H4V2z" fill="#fff"/></svg>
                Untitled - Notepad
            </div>
            <div class="title-bar-controls">
                <button class="win95-btn control-btn">0</button> <!-- Minimize symbol proxy -->
                <button class="win95-btn control-btn">1</button> <!-- Maximize symbol proxy -->
                <button class="win95-btn control-btn" onclick="closeNotepad()">X</button>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-item"><span>F</span>ile</div>
            <div class="menu-item"><span>E</span>dit</div>
            <div class="menu-item"><span>S</span>earch</div>
            <div class="menu-item"><span>H</span>elp</div>
        </div>
        <div class="window-content win95-inset">
            <textarea spellcheck="false">Welcome to Windows 95.</textarea>
        </div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu win95-outset" id="startMenu">
        <div class="start-menu-sidebar">
            <span>Windows95</span>
        </div>
        <div class="start-menu-items">
            <div class="start-item">Programs</div>
            <div class="start-item">Documents</div>
            <div class="start-item">Settings</div>
            <div class="start-item" onclick="alert('Shutting down...')">Shut Down...</div>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="taskbar win95-outset">
        <button class="win95-btn start-btn" id="startBtn" onclick="toggleStartMenu()">
            <svg viewBox="0 0 16 16" width="16" height="16"><rect width="16" height="16" fill="#000080"/><text x="2" y="12" fill="#fff" font-size="10" font-weight="bold">W</text></svg>
            Start
        </button>
        <div class="system-tray win95-inset" id="clock">
            12:00 PM
        </div>
    </div>

    <script>
        // --- Start Menu Toggle ---
        function toggleStartMenu() {
            const menu = document.getElementById('startMenu');
            const btn = document.getElementById('startBtn');
            menu.classList.toggle('start-menu-active');
            
            if(menu.classList.contains('start-menu-active')) {
                btn.style.borderTop = "2px solid #000";
                btn.style.borderLeft = "2px solid #000";
                btn.style.borderRight = "2px solid #fff";
                btn.style.borderBottom = "2px solid #fff";
            } else {
                btn.style.borderTop = "2px solid #fff";
                btn.style.borderLeft = "2px solid #fff";
                btn.style.borderRight = "2px solid #000";
                btn.style.borderBottom = "2px solid #000";
            }
        }

        // Close menu if clicked outside
        window.addEventListener('click', function(e){
